name: Deploy Backend

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: pdo, pdo_mysql, mbstring, xml, curl, zip, bcmath, intl, gd

    - name: Install PHP dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Setup Node.js for backend
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Build backend assets
      run: npm run build

    - name: Create .env file
      run: |
        cp .env.example .env
        sed -i 's|APP_ENV=.*|APP_ENV=production|' .env
        sed -i 's|APP_DEBUG=.*|APP_DEBUG=false|' .env
        sed -i 's|APP_URL=.*|APP_URL=https://panel.weekilaw.com|' .env
        # Keep SQLite for reliability
        sed -i 's|DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
        sed -i 's|DB_DATABASE=.*|DB_DATABASE=/var/www/weekilaw-backend/database/database.sqlite|' .env
        echo "FLASK_API_URL=http://localhost:8020/ask" >> .env

        # Add cache configuration
        echo "CACHE_STORE=redis" >> .env
        echo "REDIS_CLIENT=phpredis" >> .env
        echo "REDIS_HOST=127.0.0.1" >> .env
        echo "REDIS_PASSWORD=null" >> .env
        echo "REDIS_PORT=6379" >> .env

        # Add phone authentication settings
        echo "KAVENEGAR_API_KEY=5242444B61426662376B665444496E4D723750586762796766766766724972664561756966396E574651593D" >> .env
        echo "KAVENEGAR_TEMPLATE=liantemp" >> .env
        echo "OTP_DEV_CODE=12345" >> .env

    - name: Generate application key
      run: php artisan key:generate

    - name: Wait for Flask API
      run: |
        echo "Waiting for Flask API to be ready..."
        for i in {1..30}; do
          if curl -f http://localhost:8020/health > /dev/null 2>&1; then
            echo "✅ Flask API is ready"
            break
          fi
          echo "Waiting for Flask API... ($i/30)"
          sleep 10
        done

    - name: Run tests
      run: php artisan test --no-interaction || true

    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 50022 }}
        script: |
          # Create deployment directory if it doesn't exist
          sudo mkdir -p /var/www/weekilaw-backend

          # Stop any running processes if needed
          # Add maintenance mode
          cd /var/www/weekilaw-backend && sudo php artisan down || true

          # Backup current .env
          sudo cp /var/www/weekilaw-backend/.env /var/www/weekilaw-backend/.env.backup.$(date +%Y%m%d_%H%M%S) 2>/dev/null || true

    - name: Sync files to server
      uses: burnett01/rsync-deployments@6.0.0
      with:
        switches: -avz --delete --exclude='.git' --exclude='node_modules' --exclude='vendor' --exclude='storage' --exclude='bootstrap/cache' --exclude='tests' --exclude='.env.example' --exclude='phpunit.xml' --exclude='.github' --exclude='../weekilaw_frontend' --chown=www-data:www-data --rsync-path='sudo rsync'
        path: .
        remote_path: /var/www/weekilaw-backend
        remote_host: ${{ secrets.SSH_HOST }}
        remote_user: ${{ secrets.SSH_USER }}
        remote_key: ${{ secrets.SSH_KEY }}
        remote_port: ${{ secrets.SSH_PORT || 50022 }}

    - name: Run deployment commands on server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        port: ${{ secrets.SSH_PORT || 50022 }}
        script: |
          cd /var/www/weekilaw-backend

          # Add maintenance mode
          sudo -u www-data php artisan down || true

          # Install PHP dependencies
          sudo -u www-data composer install --no-dev --optimize-autoloader --no-interaction

          # Set proper permissions for Laravel
          # Files are already owned by www-data:www-data via rsync --chown
          chmod -R 775 /var/www/weekilaw-backend/storage
          chmod -R 775 /var/www/weekilaw-backend/bootstrap/cache

          # Ensure database directory exists and has correct permissions
          mkdir -p /var/www/weekilaw-backend/database
          chmod 775 /var/www/weekilaw-backend/database

          # Clear all caches FIRST (CRITICAL!)
          sudo -u www-data php artisan config:clear
          sudo -u www-data php artisan cache:clear
          sudo -u www-data php artisan route:clear
          sudo -u www-data php artisan view:clear

          # Generate app key if missing
          if ! sudo -u www-data php artisan key:generate --show 2>/dev/null | grep -q "base64:"; then
            sudo -u www-data php artisan key:generate --force
          fi

          # Create SQLite database file if it doesn't exist
          sudo -u www-data touch /var/www/weekilaw-backend/database/database.sqlite

          # Run migrations (includes temp_otps table)
          sudo -u www-data php artisan migrate --force --no-interaction

          # Create storage link
          sudo -u www-data php artisan storage:link || true

          # Rebuild caches AFTER migrations
          sudo -u www-data php artisan config:cache
          sudo -u www-data php artisan route:cache
          sudo -u www-data php artisan view:cache

          # Remove maintenance mode
          sudo -u www-data php artisan up

          # Ensure Redis is running (requires sudo access)
          sudo systemctl enable redis-server || echo "Redis already enabled"
          sudo systemctl restart redis-server || echo "Redis restart failed"

          # Restart PHP-FPM (requires sudo access)
          sudo systemctl reload php8.4-fpm || echo "PHP-FPM reload failed"

          # Run post-deployment setup
          echo "Running post-deployment setup..."

          # Ensure database permissions
          chmod 664 /var/www/weekilaw-backend/database/database.sqlite 2>/dev/null || true

          # Clean expired OTPs
          sudo -u www-data php artisan tinker --execute="\DB::table('temp_otps')->where('expires_at', '<', \Carbon\Carbon::now())->delete(); echo 'Expired OTPs cleaned';" 2>/dev/null || true

          # Test the deployment
          echo "Testing deployment..."
          if curl -f -s https://panel.weekilaw.com/api/health 2>/dev/null | grep -q '"status":"healthy"'; then
            echo "✅ API is healthy"
          else
            echo "⚠️ API health check failed"
            curl -s https://panel.weekilaw.com/api/health 2>/dev/null || echo "Could not reach health endpoint"
          fi

          # Test registration endpoint
          if curl -s -X POST https://panel.weekilaw.com/api/auth/phone/send-register-otp -H 'Content-Type: application/json' -d '{"phone":"09123456789"}' 2>/dev/null | grep -q '"success":true'; then
            echo "✅ Registration endpoint working"
          else
            echo "⚠️ Registration endpoint test failed"
          fi

          echo "Backend deployment completed successfully!"
