version: '3.8'

services:
  laravel-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weekilaw-laravel
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - FLASK_API_URL=http://flask-api:8000
    volumes:
      - ./storage:/var/www/storage
      - ./database:/var/www/database
    depends_on:
      - flask-api
    networks:
      - weekilaw-network

  flask-api:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    container_name: weekilaw-flask-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - FLASK_ENV=production
    networks:
      - weekilaw-network

  nginx:
    image: nginx:alpine
    container_name: weekilaw-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
      - ./public:/var/www/public
    depends_on:
      - laravel-app
      - flask-api
    networks:
      - weekilaw-network

networks:
  weekilaw-network:
    driver: bridge

volumes:
  db_data:
  app_storage: